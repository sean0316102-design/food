        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;

            left: 0;
            z-index: 1;

        /* Morandi Glassmorphism */
        .morandi-panel {

            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f7f4ef;
        }

        /* 3D Pin Overlay */
        .marker-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            z-index: 10;
        }

        .marker-pin:hover {
            transform: translate(-50%, -115%) scale(1.12);
        }

        .marker-pin.active {
            transform: translate(-50%, -120%) scale(1.2);
        }

        @keyframes soft-pulse {
            0% { transform: scale(0.7); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .pulse-effect::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background-color: rgba(138, 168, 137, 0.5);
            animation: soft-pulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // Scene & Soft Morandi Fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#dce5eb');
            scene.fog = new THREE.FogExp2('#dce5eb', 0.025);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 14, 16);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 6;
            controls.maxDistance = 32;
            controls.target.set(0, 0, 0);

            // Lights
            ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            hemiLight = new THREE.HemisphereLight(0xe8f0f8, 0x8aa889, 0.4);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            dirLight = new THREE.DirectionalLight(0xfff8ee, 1.1);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.camera.left = -10;
            dirLight.shadow.camera.right = 10;
            dirLight.shadow.camera.top = 10;
            dirLight.shadow.camera.bottom = -10;
            scene.add(dirLight);

            applyLightingState(0);
        }

        // --- LOW-POLY TAIWAN ISLAND (PASTORAL MATCHA STYLE) ---
        function createTaiwanIsland() {
            taiwanGroup = new THREE.Group();

            // Island Main Base
            const islandGeo = new THREE.CylinderGeometry(5.2, 5.8, 1.8, 7, 2);
            
            const posAttr = islandGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);

                let newZ = z * 1.6;
                let newX = x * 0.75;
                const taperFactor = 1 - Math.pow(newZ / 8, 2) * 0.3;
                newX *= Math.max(0.4, taperFactor);

                const jitter = (Math.sin(newX * 3) + Math.cos(newZ * 3)) * 0.22;
                posAttr.setXYZ(i, newX + jitter, y + (Math.random() * 0.18), newZ);
            }
            islandGeo.computeVertexNormals();

            // Pastoral Matcha Terrain Material
            const terrainMat = new THREE.MeshStandardMaterial({
                color: 0x8aa889, // Pastoral Matcha Green
                roughness: 0.85,
                metalness: 0.05,
                flatShading: true
            });

            const mainIsland = new THREE.Mesh(islandGeo, terrainMat);
            mainIsland.position.y = 0;
            mainIsland.receiveShadow = true;
            mainIsland.castShadow = true;
            taiwanGroup.add(mainIsland);

            // Morandi Soil Layer
            const soilGeo = new THREE.CylinderGeometry(5.6, 4.2, 1.4, 7);
            const soilMat = new THREE.MeshStandardMaterial({
                color: 0x99928a, // Morandi Warm Gray
                roughness: 0.9,
                flatShading: true
            });
            const soil = new THREE.Mesh(soilGeo, soilMat);
            soil.position.y = -1.1;
            soil.scale.set(0.9, 1, 1.5);
            soil.receiveShadow = true;
            taiwanGroup.add(soil);

            // Mountain Peaks
            const mountainMat = new THREE.MeshStandardMaterial({
                color: 0x5a755a,
                roughness: 0.9,
                flatShading: true
            });
            const snowMat = new THREE.MeshStandardMaterial({
                color: 0xf7f4ef,
                roughness: 0.6,
                flatShading: true
            });

            const mountainPositions = [
                { x: 0.2, z: -2.0, r: 1.2, h: 2.2 },
                { x: 0.0, z: -0.5, r: 1.5, h: 2.8 },
                { x: -0.3, z: 1.0, r: 1.3, h: 2.4 },
                { x: 0.4, z: 2.2, r: 1.1, h: 1.8 }
            ];

            mountainPositions.forEach(m => {
                const mGeo = new THREE.ConeGeometry(m.r, m.h, 5);
                const mountain = new THREE.Mesh(mGeo, mountainMat);
                mountain.position.set(m.x, 0.9 + m.h / 2, m.z);
                mountain.castShadow = true;
                mountain.receiveShadow = true;
                taiwanGroup.add(mountain);

                if (m.h > 2.0) {
                    const capGeo = new THREE.ConeGeometry(m.r * 0.4, m.h * 0.3, 5);
                    const cap = new THREE.Mesh(capGeo, snowMat);
                    cap.position.set(m.x, 0.9 + m.h * 0.85, m.z);
                    taiwanGroup.add(cap);
                }
            });

            // Trees
            const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x7c6a58, flatShading: true });
            const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x6b8e23, flatShading: true });

            for (let i = 0; i < 26; i++) {
                const distZ = (Math.random() - 0.5) * 6.5;
                const distX = (Math.random() - 0.5) * 2.5;

                const treeGroup = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.4, 4), treeTrunkMat);
                trunk.position.y = 0.2;
                
                const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35, 0), treeLeavesMat);
                leaves.position.y = 0.5;
                leaves.castShadow = true;

                treeGroup.add(trunk);
                treeGroup.add(leaves);
                treeGroup.position.set(distX, 0.9, distZ);
                treeGroup.scale.setScalar(0.7 + Math.random() * 0.4);
                taiwanGroup.add(treeGroup);
            }

            scene.add(taiwanGroup);
        }

        // --- OCEAN MESH ---
        function createOcean() {
            const oceanGeo = new THREE.PlaneGeometry(120, 120, 32, 32);
            oceanGeo.rotateX(-Math.PI / 2);

            const oceanMat = new THREE.MeshStandardMaterial({
                color: 0x8fa4b3, // Morandi Blue Ocean
                roughness: 0.3,
                metalness: 0.1,
                transparent: true,
                opacity: 0.82,
                flatShading: true
            });

            oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
            oceanMesh.position.y = -0.5;
            scene.add(oceanMesh);
        }

        // --- LOW-POLY BOBA MASCOT ---
        function createMascot() {
            mascotMesh = new THREE.Group();

            const cupGeo = new THREE.CylinderGeometry(0.3, 0.22, 0.6, 8);
            const cupMat = new THREE.MeshStandardMaterial({ color: 0xf7f4ef, flatShading: true });
            const cup = new THREE.Mesh(cupGeo, cupMat);
            cup.position.y = 0.3;
            cup.castShadow = true;
            mascotMesh.add(cup);

            const strawGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.7, 5);
            const strawMat = new THREE.MeshStandardMaterial({ color: 0xc39b8b });
            const straw = new THREE.Mesh(strawGeo, strawMat);
            straw.position.set(0.08, 0.55, 0);
            straw.rotation.z = -0.2;
            mascotMesh.add(straw);

            const eyeGeo = new THREE.SphereGeometry(0.04, 6, 6);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x2b353b });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.1, 0.38, 0.26);
            const rightEye = leftEye.clone();
            rightEye.position.x = 0.1;
            mascotMesh.add(leftEye);
            mascotMesh.add(rightEye);

            mascotMesh.position.set(0.8, 1.2, -2.8);
            scene.add(mascotMesh);
        }

        // --- FLOATING HTML MARKERS ---
        function createFoodMarkers() {
            const container = document.getElementById('markers-container');

            FOOD_SPOTS.forEach((spot) => {
                const el = document.createElement('div');
                el.className = `marker-pin pulse-effect pointer-events-auto flex items-center gap-1.5 px-3 py-1.5 rounded-full shadow-md border border-white/80 text-xs font-semibold backdrop-blur-md transition-transform duration-300`;
                el.style.backgroundColor = 'rgba(247, 244, 239, 0.95)';
                el.style.color = '#2b353b';
                el.innerHTML = `<span>${spot.icon}</span> <span>${spot.name}</span>`;
                el.setAttribute('data-id', spot.id);
                el.setAttribute('data-region', spot.region);

                el.onclick = () => selectFoodSpot(spot);
                container.appendChild(el);

                markers.push({
                    element: el,
                    pos: new THREE.Vector3(spot.pos.x, spot.pos.y, spot.pos.z),
                    data: spot
                });
            });
        }

        function updateMarkersPosition() {
            const projVector = new THREE.Vector3();
            
            markers.forEach(m => {
                projVector.copy(m.pos);
                projVector.project(camera);

                const x = (projVector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(projVector.y * 0.5) + 0.5) * window.innerHeight;

                if (projVector.z < 1) {
                    m.element.style.transform = `translate(-50%, -100%) translate3d(${x}px, ${y}px, 0px)`;
                    m.element.style.display = 'flex';
                } else {
                    m.element.style.display = 'none';
                }
            });
        }

        // --- SELECT FOOD & ANIMATE ---
        function selectFoodSpot(spot) {
            activeSpot = spot;

            markers.forEach(m => {
                if (m.data.id === spot.id) {
                    m.element.classList.add('active', 'ring-2', 'ring-matcha-500');
                    m.element.style.backgroundColor = '#8aa889';
                    m.element.style.color = '#ffffff';
                } else {
                    m.element.classList.remove('active', 'ring-2', 'ring-matcha-500');
                    m.element.style.backgroundColor = 'rgba(247, 244, 239, 0.95)';
                    m.element.style.color = '#2b353b';
                }
            });

            // Mascot Movement
            gsap.to(mascotMesh.position, {
                x: spot.pos.x,
                y: spot.pos.y,
                z: spot.pos.z,
                duration: 1.2,
                ease: "power2.out"
            });

            gsap.to(mascotMesh.position, {
                y: spot.pos.y + 0.4,
                duration: 0.3,
                repeat: 3,
                yoyo: true,
                delay: 0.2,
                ease: "power1.inOut"
            });

            // Camera Zoom
            gsap.to(camera.position, {
                x: spot.pos.x + 3.2,
                y: spot.pos.y + 2.8,
                z: spot.pos.z + 4.2,
                duration: 1.5,
                ease: "power3.inOut"
            });

            gsap.to(controls.target, {
                x: spot.pos.x,
                y: spot.pos.y,
                z: spot.pos.z,
                duration: 1.5,
                ease: "power3.inOut"
            });

            // Update Drawer Card
            document.getElementById('card-img').src = spot.img;
            document.getElementById('card-icon').innerText = spot.icon;
            document.getElementById('card-region').innerText = spot.regionName;
            document.getElementById('card-title').innerText = spot.name;
            document.getElementById('card-desc').innerText = spot.desc;
            document.getElementById('card-tag').innerText = spot.tag;

            const card = document.getElementById('food-card');
            card.classList.remove('translate-y-full', 'opacity-0');
            card.classList.add('translate-y-0', 'opacity-100');
        }

        function closeFoodCard() {
            const card = document.getElementById('food-card');
            card.classList.add('translate-y-full', 'opacity-0');
            card.classList.remove('translate-y-0', 'opacity-100');

            markers.forEach(m => {
                m.element.classList.remove('active', 'ring-2', 'ring-matcha-500');
                m.element.style.backgroundColor = 'rgba(247, 244, 239, 0.95)';
                m.element.style.color = '#2b353b';
            });
            activeSpot = null;
        }

        function focusSelectedFood() {
            if (!activeSpot) return;
            gsap.to(camera.position, {
                x: activeSpot.pos.x + 1.8,
                y: activeSpot.pos.y + 1.2,
                z: activeSpot.pos.z + 2.2,
                duration: 1.0,
                ease: "power2.out"
            });
        }

        // --- REGION FILTERING ---
        function filterRegion(regionKey) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('onclick').includes(regionKey)) {
                    btn.className = "filter-btn active px-4 py-1.5 rounded-full text-xs font-medium transition-all bg-matcha-500 text-white shadow-sm";
                } else {
                    btn.className = "filter-btn px-4 py-1.5 rounded-full text-xs font-medium transition-all hover:bg-matcha-100 dark:hover:bg-slate-800";
                }
            });

            markers.forEach(m => {
                if (regionKey === 'all' || m.data.region === regionKey) {
                    m.element.style.opacity = '1';
                    m.element.style.pointerEvents = 'auto';
                    gsap.fromTo(m.element, { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" });
                } else {
                    m.element.style.opacity = '0.2';
                    m.element.style.pointerEvents = 'none';
                }
            });

            if (regionKey === 'all') resetCamera();
        }

        // --- CAMERA RESET ---
        function resetCamera() {
            closeFoodCard();
            gsap.to(camera.position, {
                x: 12,
                y: 14,
                z: 16,
                duration: 1.5,
                ease: "power3.inOut"
            });

            gsap.to(controls.target, {
                x: 0,
                y: 0,
                z: 0,
                duration: 1.5,
                ease: "power3.inOut"
            });
        }

        // --- MORANDI DAY / SUNSET / NIGHT CYCLES ---
        function cycleLighting() {
            lightStateIndex = (lightStateIndex + 1) % 3;
            applyLightingState(lightStateIndex);
        }

        function applyLightingState(index) {
            const lightIcon = document.getElementById('light-icon');
            
            if (index === 0) { // DAY
                scene.background.set('#dce5eb'); // Soft Slate Sky
                scene.fog.color.set('#dce5eb');
                dirLight.color.set('#fff8ee');
                dirLight.intensity = 1.1;
                ambientLight.intensity = 0.7;
                lightIcon.className = 'fa-solid fa-sun text-matcha-700';
                document.documentElement.classList.remove('dark');
            } else if (index === 1) { // SUNSET
                scene.background.set('#e2a98e'); // Morandi Terracotta Sunset
                scene.fog.color.set('#e2a98e');
                dirLight.color.set('#ff8c69');
                dirLight.intensity = 0.95;
                ambientLight.intensity = 0.5;
                lightIcon.className = 'fa-solid fa-cloud-sun text-amber-600';
                document.documentElement.classList.add('dark');
            } else if (index === 2) { // NIGHT
                scene.background.set('#2b353b'); // Morandi Navy Night
                scene.fog.color.set('#2b353b');
                dirLight.color.set('#8fa4b3');
                dirLight.intensity = 0.4;
                ambientLight.intensity = 0.3;
                lightIcon.className = 'fa-solid fa-moon text-blue-300';
                document.documentElement.classList.add('dark');
            }
        }

        function toggleAutoRotate() {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
            controls.autoRotateSpeed = 1.2;
            
            const btn = document.getElementById('rotate-btn');
            if (isAutoRotating) {
                btn.classList.add('bg-matcha-500', 'text-white');
            } else {
                btn.classList.remove('bg-matcha-500', 'text-white');
            }
        }

        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);
            controls.update();

            // Gentle wave dynamics
            if (oceanMesh) {
                const pos = oceanMesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const u = pos.getX(i);
                    const v = pos.getY(i);
                    const z = Math.sin(u * 0.4 + time * 0.0018) * 0.12 + Math.cos(v * 0.4 + time * 0.0012) * 0.12;
                    pos.setZ(i, z);
                }
                oceanMesh.geometry.attributes.position.needsUpdate = true;
            }

            updateMarkersPosition();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
